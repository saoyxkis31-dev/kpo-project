version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: sekisq3l
      POSTGRES_PASSWORD: 3110_step
      POSTGRES_DB: confetki
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      # вместо localhost пишем имя контейнера базы данных  db
      CONN_STRING: "postgres://sekisq3l:3110_step@db:5432/confetki?sslmode=disable"
    depends_on:
      - db

volumes:
  pgdata: